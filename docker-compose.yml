version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: rs_permata_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1122
      POSTGRES_DB: db_laporan_rs
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-api:
    build: .
    container_name: rs_permata_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres-db
    env_file:
      - .env
    environment:
      # Menimpa DB_HOST lokal Anda agar terhubung ke container PostgreSQL
      DB_HOST: postgres-db
      PORT: 3000

volumes:
  postgres_data: