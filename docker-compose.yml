version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: rs_permata_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1122
      POSTGRES_DB: db_laporan_rs
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: